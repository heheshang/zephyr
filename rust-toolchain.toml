# 固定工具链为 nightly。
#
# 原因：根目录 `rustfmt.toml` 中的 `imports_granularity`、`group_imports`、
# `fn_single_line`、`match_arm_blocks`、`force_multiline_blocks` 都是
# **nightly-only** 选项。在 stable 工具链下 rustfmt 会打印警告并静默忽略它们，
# 导致「配置写了但实际没生效」的隐性降级。
#
# 固定 nightly 后，`cargo fmt` / `cargo clippy` 始终使用 nightly，
# rustfmt 配置与代码实际格式保持一致。
#
# 若团队需要回到 stable：
#   1. 删除本文件；
#   2. 删除 `rustfmt.toml` 中的上述 nightly-only 选项。
[toolchain]
channel = "nightly"
components = ["rustfmt", "clippy"]
